<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error-Friendly Typing</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./vendor/p5.min.js"></script>
    <script src="./vendor/p5.sound.min.js"></script>
  </head>
  <body>
    <main class="typing-stage">
      <div class="typing-heading">
        <span>ERROR-FRIENDLY TYPING</span>
        <h1>Tri one werd</h1>
      </div>
      <div id="typing-controls" class="typing-controls"></div>
      <div id="sketch-shell" class="sketch-shell" aria-label="Interactive word canvas"></div>
      <div class="typing-legend" aria-hidden="true">
        <span><i class="legend-correct"></i>correct</span>
        <span><i class="legend-readable"></i>readable mistake</span>
        <span><i class="legend-noise"></i>noise</span>
      </div>
    </main>
    <script src="./sketch.js"></script>
  </body>
</html>
